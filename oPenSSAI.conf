# oPenSSAI WireGuard config (renamed from SideStore.conf).
#
# IMPORTANT: the keys below are SideStore's official keypair, kept on purpose.
# They are coupled to the server side baked into the em_proxy XCFramework
# (Dependencies/minimuxer): the server holds the matching server private key
# and accepts this client key. Regenerating these keys alone would BREAK the
# VPN handshake. To use oPenSSAI's own keys, fork the em_proxy Rust source,
# bake in a new keypair, and rebuild the XCFramework. See docs/ARCHITECTURE.md.
#
[Interface]
PrivateKey = AIIeeUDvk3NeAFJ9BWCQvPJize/9WZibMnGJ/0rt5k4=
Address = 10.7.0.10/24

[Peer]
PublicKey = kHDoekeYhBvfW9a9UQ+UCmpbG423eejTjcjW+DT+JF0=
AllowedIPs = 10.7.0.1/32
Endpoint = 127.0.0.1:51820
