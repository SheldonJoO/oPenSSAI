[package]
name = "openssai-location-helper"
version = "0.1.0"
edition = "2024"
description = "Mac helper for openSSS virtual location: receives coordinates over HTTP and drives the iPhone's DVT location simulation service via the idevice library."
license = "AGPL-3.0-or-later"

[[bin]]
name = "openssai-location-helper"
path = "src/main.rs"

[dependencies]
# Pinned: idevice 0.1.x may break its API at any point release (upstream
# statement). Do not bump without re-checking the DVT call chain.
idevice = { version = "=0.1.68", features = ["full"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
